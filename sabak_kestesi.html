<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Golos+Text:wght@600;700&display=swap" rel="stylesheet">
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-text-size-adjust:100%;}
header{background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25);min-height:54px;gap:8px;}

.vt{background:transparent;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.8);border-radius:5px;padding:4px 8px;font-size:.7rem;cursor:pointer;font-family:inherit;}

.lsw{display:flex;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.25);}
.lb{background:transparent;border:none;color:rgba(255,255,255,.75);padding:5px 8px;font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit;}
.lb.on{background:rgba(255,255,255,.25);color:#fff;}
.fw{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-width:1400px;margin:0 auto;}
.fgi{display:flex;flex-direction:column;gap:2px;}
.fgi label{font-size:.64rem;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.3px;}
select{border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:var(--r2);padding:7px 26px 7px 9px;font-size:.82rem;font-family:inherit;cursor:pointer;width:100%;-webkit-appearance:none;appearance:none;

.fa{grid-column:1/-1;}
.cb{background:var(--ac);color:#fff;border:none;border-radius:var(--r2);font-weight:600;padding:8px 0;font-family:inherit;font-size:.82rem;cursor:pointer;width:100%;}
.ib{max-width:1400px;margin:10px auto 0;padding:0 14px;}
.ic{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;gap:6px;}
.ir{display:flex;align-items:center;gap:8px;font-size:.78rem;}
.fb{color:#fff;border-radius:4px;padding:1px 8px;font-size:.68rem;font-weight:700;white-space:nowrap;}
.ir span.rm{color:var(--mu);font-size:.75rem;}
.sb{max-width:1400px;margin:7px auto 0;padding:0 14px;display:flex;gap:5px;flex-wrap:wrap;}
.sp{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:.73rem;color:var(--mu);}
.sp b{color:var(--tx);}
.bdg{display:inline-block;border-radius:4px;padding:2px 7px;font-size:.7rem;font-weight:600;white-space:nowrap;}
.be{background:var(--eb);color:var(--en);}
.bm{background:var(--mb);color:var(--ma);}
.bs1{background:#E0F2FE;color:#0369A1;}
.bs2{background:#FEF9C3;color:#854D0E;}
.td{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;flex-shrink:0;}
.tw{max-width:1400px;margin:10px auto 70px;padding:0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;background:var(--sf);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);min-width:490px;}
thead{background:var(--ac);}
thead th{color:#fff;font-size:.7rem;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--bd);}

td{padding:6px 10px;font-size:.77rem;vertical-align:middle;}
.cg{max-width:1400px;margin:10px auto 70px;padding:0 14px;display:grid;grid-template-columns:1fr;gap:8px;}
.cd{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bd);padding:11px 13px;display:flex;flex-direction:column;gap:7px;}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.cgs{font-family:'Golos Text',sans-serif;font-size:.9rem;font-weight:700;}
.cs{font-size:.77rem;font-weight:600;white-space:nowrap;padding-top:2px;}
.cs.e{color:var(--en);}.cs.m{color:var(--ma);}
.cm{display:flex;flex-wrap:wrap;gap:4px;}
.tg{background:#E8EDF5;color:#374362;border-radius:4px;padding:2px 7px;font-size:.71rem;font-weight:500;}
.wg{max-width:1400px;margin:10px auto 70px;padding:0 14px;}
.wdc{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:9px;overflow:hidden;}
.wdh{background:var(--ac);color:#fff;padding:7px 13px;font-size:.82rem;font-weight:700;}
.wsl{padding:4px 13px;font-size:.68rem;font-weight:600;color:var(--mu);background:var(--sf2);border-bottom:1px solid var(--bd);}
.wsr{display:flex;border-bottom:1px solid var(--bd);}
.wsr:last-child{border-bottom:none;}
.wt{min-width:80px;padding:6px 7px;background:var(--sf2);font-size:.66rem;font-weight:600;color:var(--mu);display:flex;align-items:flex-start;border-right:1px solid var(--bd);white-space:nowrap;}
.wi{flex:1;padding:4px 7px;display:flex;flex-direction:column;gap:3px;}
.si{border-radius:5px;padding:4px 7px;font-size:.73rem;line-height:1.4;}
.sie{background:#EEF4FF;}.sim{background:#FFFBEB;}
.sg{font-weight:700;font-size:.73rem;}
.si2{color:var(--mu);font-size:.67rem;margin-top:1px;}
.wgt{display:none;}
.em{text-align:center;padding:44px 20px;color:var(--mu);font-size:.88rem;}
.em svg{display:block;margin:0 auto 11px;opacity:.3;}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);box-shadow:0 -2px 10px rgba(30,58,110,.08);z-index:99;}
.bb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px 8px;font-size:.6rem;font-weight:600;color:var(--mu);background:transparent;border:none;cursor:pointer;font-family:inherit;gap:2px;}
.bb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.bb.on{color:var(--ac);}
@media(min-width:768px){

  .logo{font-size:1.05rem;}.lsub{display:inline;font-size:.85rem;margin-top:0;margin-left:8px;}
  .vt-wrap{display:flex;}.bn{display:none;}
  .fg{grid-template-columns:repeat(3,1fr);}.fa{grid-column:auto;}
  .fw,.tw,.cg,.wg,.sb,.ib{padding-left:24px;padding-right:24px;}

  .tw,.wg{margin-bottom:40px;}
  .wdc{display:none;}
  .wgt{display:table;width:100%;border-collapse:collapse;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
  .wgt th{background:var(--ac);color:#fff;padding:9px 9px;font-size:.75rem;font-weight:600;white-space:nowrap;min-width:110px;}

  .wgt td{border:1px solid var(--bd);padding:4px 5px;vertical-align:top;}
  .sc{display:flex;flex-direction:column;gap:3px;}
}
@media(min-width:1024px){.fg{grid-template-columns:repeat(6,1fr);}}
</style>

<script>
const TR={

const TC={'Қарлығаш':{c:'#7C3AED',b:'#EDE9FE'},'Эрфан':{c:'#0891B2',b:'#CFFAFE'},'Айдын':{c:'#059669',b:'#D1FAE5'},'Аружан':{c:'#EA580C',b:'#FFEDD5'},'Рустам':{c:'#1D6F42',b:'#DCFCE7'},'Бауыржан':{c:'#B45309',b:'#FEF3C7'},'Фарида':{c:'#DB2777',b:'#FCE7F3'},'Әсия':{c:'#DC2626',b:'#FEE2E2'},'Тілекші':{c:'#6D28D9',b:'#EDE9FE'},'Әділжан':{c:'#0369A1',b:'#E0F2FE'}};

gs.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;fg2.appendChild(o);});

let cv='table';
function sv(v){
  cv=v;
  ['table','cards','week'].forEach(x=>{
    document.getElementById('view-'+x).style.display=x===v?'':'none';
    const h=document.getElementById('v-'+x);if(h)h.classList.toggle('on',x===v);
    const b=document.getElementById('bn-'+x);if(b)b.classList.toggle('on',x===v);
  });af();
}
function gf(){return{sh:document.getElementById('fs').value,dy:document.getElementById('fd').value,sb:document.getElementById('fj').value,tu:document.getElementById('ft').value,rm:document.getElementById('fr').value,gr:document.getElementById('fg2').value};}
function cf(){['fs','fd','fj','ft','fr','fg2'].forEach(id=>document.getElementById(id).value='');af();}
function fd2(f,data){return data.filter(r=>(!f.sh||r.sh===f.sh)&&(f.dy===''||r.d===parseInt(f.dy))&&(!f.sb||r.sb===f.sb)&&(!f.tu||r.tu===f.tu)&&(!f.rm||r.rm===f.rm)&&(!f.gr||r.g===f.gr));}
function srt(data){return[...data].sort((a,b)=>a.d-b.d||SO[a.s]-SO[b.s]);}

function si(r){const tc=TC[r.tu]||{c:'#888',b:'#eee'};const gc2=gc(r.g);
  return`<div class="si ${r.sb==='E'?'sie':'sim'}" style="border-left:3px solid ${tc.c}">
    <div class="sg"><span style="background:${gc2.bg};border:1px solid ${gc2.bd};color:${gc2.bd};border-radius:3px;padding:1px 4px;font-size:.68rem;font-weight:700">${r.g}</span></div>
    <div class="si2">${tdot(r.tu)} ${r.tu} · ${r.rm}</div>
  </div>`;}

function rt(data){
  const tb=document.getElementById('tb'),te=document.getElementById('te');
  const sp=te.querySelector('[data-t="nd"]');if(sp)sp.textContent=t('nd');
  if(!data.length){tb.innerHTML='';te.style.display='block';return;}
  te.style.display='none';
  tb.innerHTML=srt(data).map(r=>{const tc=TC[r.tu]||{c:'#888'};const gc2=gc(r.g);
    return`<tr style="border-left:4px solid ${tc.c}">
      <td><b>${t('days')[r.d]}</b></td><td>${bsh(r.sh)}</td>
      <td style="white-space:nowrap;font-size:.75rem">${r.tm}</td><td style="font-size:.75rem">${r.rm}</td>
      <td>${ttag(r.tu)}</td><td>${bsj(r.sb)}</td>
      <td><span style="background:${gc2.bg};border:1.5px solid ${gc2.bd};color:${gc2.bd};border-radius:4px;padding:2px 6px;font-size:.7rem;font-weight:700">${r.g}</span></td>
    </tr>`;}).join('');}

function rc(data){
  const w=document.getElementById('view-cards');
  if(!data.length){w.innerHTML=`<div class="em"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>${t('nd')}</div>`;return;}
  w.innerHTML=srt(data).map(r=>{const tc=TC[r.tu]||{c:'#888'};const gc2=gc(r.g);
    return`<div class="cd" style="border-left:4px solid ${tc.c}">
      <div class="ct"><div class="cgs"><span style="background:${gc2.bg};border:1.5px solid ${gc2.bd};color:${gc2.bd};border-radius:5px;padding:2px 7px;font-size:.78rem;font-weight:700">${r.g}</span></div>
      <div class="cs ${r.sb==='E'?'e':'m'}">${r.sb==='E'?t('sje'):t('sjm')}</div></div>
      <div class="cm"><span class="tg">📅 ${t('days')[r.d]}</span><span class="tg">🕐 ${r.tm}</span><span class="tg">📍 ${r.rm}</span>${ttag(r.tu)}${bsh(r.sh)}</div>
    </div>`;}).join('');}

function rw(data){
  const w=document.getElementById('view-week');
  if(!data.length){w.innerHTML=`<div class="em"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>${t('nd')}</div>`;return;}
  const f=gf();
  const byDS={};data.forEach(r=>{const k=r.d+'|'+r.s;(byDS[k]=byDS[k]||[]).push(r);});
  const aD=f.dy!==''?[parseInt(f.dy)]:[0,1,2,3,4];
  const aS=f.sh==='1'?['S1','S2','S3','S4']:f.sh==='2'?['F1','F2','F3','F4']:['S1','S2','S3','S4','F1','F2','F3','F4'];
  const s1=aS.filter(s=>s.startsWith('S')),s2=aS.filter(s=>s.startsWith('F'));

  // Мобильді: уақыт реті бойынша сорт
  let mH='';
  aD.forEach(d=>{
    const sl=aS.filter(s=>(byDS[d+'|'+s]||[]).length>0);
    if(!sl.length)return;
    mH+=`<div class="wdc"><div class="wdh">📅 ${t('days')[d]}</div>`;
    let lsh='';
    sl.sort((a,b)=>SO[a]-SO[b]).forEach(s=>{
      const items=byDS[d+'|'+s]||[];if(!items.length)return;
      const sh=s.startsWith('S')?'1':'2';
      if(sh!==lsh){mH+=`<div class="wsl">${t('ls'+sh)}</div>`;lsh=sh;}
      mH+=`<div class="wsr"><div class="wt">${TM[s]}</div><div class="wi">${items.map(si).join('')}</div></div>`;
    });
    mH+='</div>';
  });

  function mkR(slots,h){
    slots.filter(s=>aD.some(d=>(byDS[d+'|'+s]||[]).length>0)).forEach(s=>{
      h+=`<tr><td class="stl">${TM[s]}</td>`;
      aD.forEach(d=>{const items=byDS[d+'|'+s]||[];h+=`<td><div class="sc">${items.map(si).join('')}</div></td>`;});
      h+='</tr>';
    });return h;
  }
  let tH=`<table class="wgt"><thead><tr><th>${t('c-ti')}</th>${aD.map(d=>`<th>${t('days')[d]}</th>`).join('')}</tr></thead><tbody>`;
  if(s1.length){tH+=`<tr><td colspan="${aD.length+1}" style="background:var(--sf2);font-size:.71rem;font-weight:700;color:var(--mu);padding:5px 10px;border-bottom:1px solid var(--bd)">${t('ls1')}</td></tr>`;tH=mkR(s1,tH);}
  if(s2.length){tH+=`<tr><td colspan="${aD.length+1}" style="background:var(--sf2);font-size:.71rem;font-weight:700;color:var(--ma);padding:5px 10px;border-bottom:1px solid var(--bd)">${t('ls2')}</td></tr>`;tH=mkR(s2,tH);}
  tH+='</tbody></table>';
  w.innerHTML=mH+tH;
}

function af(){
  const f=gf(),data=fd2(f,ALL);
  const eC=data.filter(r=>r.sb==='E').length,mC=data.filter(r=>r.sb==='M').length;
  const tC=[...new Set(data.map(r=>r.tu))].length;
  document.getElementById('sb').innerHTML=`<div class="sp">${t('sa')} <b>${data.length}</b></div><div class="sp">${t('se')} <b>${eC}</b></div><div class="sp">${t('sm')} <b>${mC}</b></div><div class="sp">${t('st')} <b>${tC}</b></div>`;
  if(cv==='table')rt(data);else if(cv==='cards')rc(data);else rw(data);
}
